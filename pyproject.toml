[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-editor"
version = "0.1.0"
description = "Local AI video rough-cut assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2.0",
    "cryptography>=42.0,<46.0",
    "openai>=1.40,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "faster-whisper>=1.0,<2.0",
    "scenedetect[opencv]>=0.6.4,<0.7",
    "scikit-learn>=1.5,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "filelock>=3.15,<4.0",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
    "black>=24.0",
]

[tool.setuptools.packages.find]
include = ["core*", "config*", "services*", "utils*", "pages*", "pipeline*"]
exclude = ["tests*", "data*", "logs*", "projects*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.black]
line-length = 88
target-version = ['py311']