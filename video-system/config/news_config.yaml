# news_config.yaml — hộp tin nóng cho Short Studio (Phụ lục G.10).
# Nguồn: Google News RSS (không cần API key). Mọi số/source ở đây là NGUỒN DUY NHẤT.
version: 1
interval_min: 60            # chu kỳ sync (yêu cầu user: 1 tiếng/lần)
auto_push: false            # G.11: KHÔNG tự đẩy Telegram hàng loạt — user chọn tin rồi push từng tin
max_items_per_push: 10      # tối đa tin bắn 1 kỳ Telegram (khi auto_push bật)
queries: []                 # Đã tắt nguồn tin nội địa VN (2026-11-14) — dùng 100% tin quốc tế
feeds: []                   # Mọi short VI & EN đều lấy từ feeds_en + queries_en bên dưới
# Mảng quốc tế (100% nguồn RSS chính thống nước ngoài, link bài là link thật).
feeds_en:
  - name: "BBC Business"
    url: "https://feeds.bbci.co.uk/news/business/rss.xml"
  - name: "CNBC"
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"
  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
  - name: "The Guardian Business"
    url: "https://www.theguardian.com/uk/business/rss"
  - name: "NPR Business"
    url: "https://feeds.npr.org/1006/rss.xml"
queries_en:                 # Google News RSS bản EN (hl=en, gl=US)
  - "global economy news"
  - "stock market today"
  - "business finance news"
  - "global shipping trade news"
  - "tech company business news"
exclude_keywords:           # tiêu đề chứa từ nào dưới đây → bỏ (an toàn nền tảng, G.1)
  - "tử vong"
  - "máu me"
  - "hiếp dâm"
  - "chính trị"
exclude_keywords_en:
  - "politics"
  - "election"
  - "dead"
  - "killed"
telegram:
  parse_mode: "HTML"
  disable_web_page_preview: false
