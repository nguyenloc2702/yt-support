# short_config.yaml — NGUỒN DUY NHẤT số liệu Short Studio (Phụ lục G).
version: 1
modes:
  news:
    target_seconds: 32          # 25–40s
    min_words: 80
    max_words: 110
    min_words_en: 65            # EN nói chậm hơn VI (~2.45 từ/s) → ngân sách giảm
    max_words_en: 90
    images_per_scene: 1
    fast_mode: true             # scene thường dùng bank, gen tối đa hero_images
    hero_images: 2
  decode:
    target_seconds: 48          # 40–60s
    min_words: 110
    max_words: 160
    min_words_en: 100
    max_words_en: 135
    images_per_scene: 1
    fast_mode: false            # gen ảnh cho mọi scene
    hero_images: 0
  daily_digest:
    target_seconds: 165         # 12–15 tin (~2m30s–2m55s, dưới ngưỡng 180s Shorts)
    voice: "en-US-BrianMultilingualNeural"  # giọng Creator Mỹ tự nhiên, tách riêng với video dài
    min_words: 220
    max_words: 480
    min_words_en: 220
    max_words_en: 465
    images_per_scene: 1
    fast_mode: true
    hero_images: 8              # dự phòng AI-gen khi bài báo/Wikimedia không có ảnh khớp
  trailer:
    target_seconds: 38          # 30–45s teaser cho video dài EN explainer (mode 3 bên chốt 2026-11-22)
    min_words: 85               # VI để sau — trailer hiện chỉ nhận lang=en
    max_words: 115
    min_words_en: 70            # ~2.45 từ/s: 30s→73, 45s→110 (yaml tts_en.words_per_sec_estimate)
    max_words_en: 105
    images_per_scene: 1
    fast_mode: true
    hero_images: 2              # AI-gen hook + 1 beat khi stock/bank không khớp chủ đề video dài
    voice: "en-US-BrianMultilingualNeural"  # đồng bộ giọng Creator EN của daily_digest
  cinematic:
    target_seconds: 45          # 30–60s kể chuyện (mục tiêu 45s)
    min_words: 100              # VI 100–140 từ
    max_words: 140
    min_words_en: 85            # EN nói chậm hơn (~2.45 từ/s) → 85–120 từ
    max_words_en: 120
    images_per_scene: 1
    fast_mode: true             # scene thường dùng bank, gen tối đa hero_images
    hero_images: 2
tts_vi:
  default_voice: "vi-VN-HoaiMyNeural"
  fallback_voice: "vi-VN-HoaiMyNeural"
  rate: "+10%"
  words_per_sec_estimate: 2.6   # tiếng Việt ~2.4–3.0 từ/s
  inter_scene_pause_sec: 0.14
tts_en:
  default_voice: "en-US-GuyNeural"
  fallback_voice: "en-US-ChristopherNeural"
  rate: "+6%"
  words_per_sec_estimate: 2.45  # đồng bộ audio_config.yaml tts_en
  inter_scene_pause_sec: 0.14
render_presets:
  vi_default: "viral_redpill"
  en_default: "split_news_60"
  cinematic: "clean_karaoke"    # karaoke-only: không badge "TIN NÓNG", không headline
master:
  loudness_lufs: -16
  true_peak_dbtp: -1.5
bgm:
  duck_db: -20.0
  bed_target_lufs: -38.0
  bgm_dir: "assets/music/bgm"   # tương đối repo root; thiếu → bỏ BGM (honest)
limits:
  max_source_chars: 14000
  max_scenes: 18
  produce_timeout_sec: 900
