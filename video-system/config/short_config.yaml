# short_config.yaml — NGUỒN DUY NHẤT số liệu Short Studio (Phụ lục G).
version: 1
modes:
  news:
    target_seconds: 32          # 25–40s
    min_words: 80
    max_words: 110
    min_words_en: 65            # EN nói chậm hơn VI (~2.45 từ/s) → ngân sách giảm
    max_words_en: 90
    images_per_scene: 1
    fast_mode: true             # scene thường dùng bank, gen tối đa hero_images
    hero_images: 2
  decode:
    target_seconds: 48          # 40–60s
    min_words: 110
    max_words: 160
    min_words_en: 100
    max_words_en: 135
    images_per_scene: 1
    fast_mode: false            # gen ảnh cho mọi scene
    hero_images: 0
tts_vi:
  default_voice: "vi-VN-HoaiMyNeural"
  fallback_voice: "vi-VN-HoaiMyNeural"
  rate: "+10%"
  words_per_sec_estimate: 2.6   # tiếng Việt ~2.4–3.0 từ/s
  inter_scene_pause_sec: 0.14
tts_en:
  default_voice: "en-US-GuyNeural"
  fallback_voice: "en-US-ChristopherNeural"
  rate: "+6%"
  words_per_sec_estimate: 2.45  # đồng bộ audio_config.yaml tts_en
  inter_scene_pause_sec: 0.14
render_presets:
  vi_default: "viral_redpill"
  en_default: "split_news_60"
master:
  loudness_lufs: -16
  true_peak_dbtp: -1.5
bgm:
  duck_db: -20.0
  bed_target_lufs: -38.0
  bgm_dir: "assets/music/bgm"   # tương đối repo root; thiếu → bỏ BGM (honest)
limits:
  max_source_chars: 6000
  max_scenes: 12
  produce_timeout_sec: 600
