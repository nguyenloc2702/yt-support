name: CI/CD Pipeline & VPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-video-worker
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8,<9" "ruff>=0.6"
      - name: Run test suite
        run: pytest -v --tb=short
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repo_lower: ${{ steps.repo_lower.outputs.repo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        id: repo_lower
        run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo_lower.outputs.repo }}/worker:latest
            ${{ env.REGISTRY }}/${{ steps.repo_lower.outputs.repo }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || 'talk.gacdero.vn' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="/opt/support-video-edit"
            REPO_LOWER="${{ needs.build-and-push.outputs.repo_lower }}"
            COMMIT_SHA="${{ github.sha }}"

            echo "=== Ensuring deployment directories ==="
            mkdir -p "$DEPLOY_PATH/shared/sessions"
            mkdir -p "$DEPLOY_PATH/shared/data"
            mkdir -p "$DEPLOY_PATH/shared/logs"
            mkdir -p "$DEPLOY_PATH/shared/rclone"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Cloning repository to $DEPLOY_PATH..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Exporting container image tag ==="
            export WORKER_IMAGE="ghcr.io/${REPO_LOWER}/worker:${COMMIT_SHA}"

            echo "=== Checking VPS disk space before pull ==="
            df -h /

            echo "=== Authenticating with GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Pulling Worker image ==="
            docker compose -f docker-compose.prod.yml pull video-worker

            echo "=== Starting Worker Container ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== Verifying Deployment Status ==="
            sleep 5
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 20 video-worker
            docker image prune -af --filter "label=app=support-video-worker" --filter "until=72h" || true
            echo "Deployment completed successfully!"
