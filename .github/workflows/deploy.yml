name: CI/CD Pipeline & VPS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-support-video-edit
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8,<9" "ruff>=0.6"
      - name: Run lint and test suite
        run: |
          ruff check .
          pytest -v --tb=short
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  deploy:
    name: Deploy video-system backend to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || 'talk.gacdero.vn' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="/opt/support-video-edit"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "Cloning repository to $DEPLOY_PATH..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Stopping retired factory worker container (tombstone 2026-11-21) ==="
            # Factory Telegram đã retire — container cũ từ image legacy vẫn chạy
            # restart:unless-stopped; gỡ hẳn để không đốt CPU/RAM/poll Telegram.
            docker rm -f support-video-worker 2>/dev/null || true

            echo "=== Syncing & restarting video-system backend (vidfac) ==="
            # The EN video API (vidfac.gacdero.vn, systemd unit "video-system") runs
            # from /opt/video-system — sync the backend code and restart, otherwise
            # pushes never reach the running process.
            if [ -d /opt/video-system ]; then
              rsync -a /opt/support-video-edit/video-system/backend/ /opt/video-system/backend/
              systemctl restart video-system || true
              sleep 3
              systemctl is-active video-system || true
              curl -s -m 5 http://127.0.0.1:8090/api/v1/health || true
            else
              echo "video-system runtime dir not present on this VPS — skipping"
            fi

            echo "Deployment completed successfully!"
