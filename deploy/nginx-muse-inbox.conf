# Cấu hình reverse proxy cho Muse Job Inbox API trên VPS talk.gacdero.vn
# Thêm block này vào bên trong server { ... } (đã có SSL HTTPS) của talk.gacdero.vn

location /api/claude-jobs/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Đảm bảo không ghi token nhạy cảm vào access log (tùy chọn bảo mật)
    # proxy_hide_header Authorization;

    # Giới hạn kích thước request body (kịch bản dài, prompt nhiều cảnh)
    client_max_body_size 20M;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
